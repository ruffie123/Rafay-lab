<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools — RafayLab</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="bg-grid"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-mark small">
                <svg viewBox="0 0 40 40" fill="none"><rect x="2" y="2" width="36" height="36" rx="10" stroke="currentColor" stroke-width="2"/><path d="M10 26L14 12L20 22L26 12L30 26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </div>
            <span class="brand">Rafay<span>Lab</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
            <a href="bots.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Bots</span></a>
            <a href="cheats.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg><span>Cheats</span></a>
            <a href="apk.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span>APK Builder</span></a>
            <a href="web.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg><span>Website</span></a>
            <a href="ai.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="5"/></svg><span>AI Tools</span></a>
            <a href="terminal.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span>Terminal</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">R</div>
                <div class="user-details">
                    <span class="user-name" id="userName">User</span>
                    <span class="user-role" id="userRole">owner</span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <header class="topbar">
            <div class="topbar-left">
                <h1>AI Tools</h1>
                <p>Chat with Gemini AI — powered by Google</p>
            </div>
        </header>

        <section class="ai-setup" id="aiSetup">
            <div class="ai-setup-card">
                <h2>Setup AI</h2>
                <p>Paste your Gemini API key to get started. It will be saved locally on your device.</p>
                <div class="input-group">
                    <label for="apiKey">Gemini API Key</label>
                    <div class="input-wrap">
                        <input type="password" id="apiKey" placeholder="AIzaSy...">
                    </div>
                </div>
                <button class="btn-login" id="saveKeyBtn" style="width:auto; padding:12px 24px; margin-top:16px;">
                    <span>Save Key</span>
                </button>
            </div>
        </section>

        <section class="ai-chat" id="aiChat" style="display:none;">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-welcome">
                    <h2>Hi! How can I help?</h2>
                    <p>Ask me anything — coding, ideas, explanations.</p>
                </div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/ai.js"></script>
</body>
</html>
