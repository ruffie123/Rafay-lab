<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafay Lab</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-mark">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="36" height="36" rx="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M10 26L14 12L20 22L26 12L30 26" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="logo-text">Rafay<span>Lab</span></h1>
                <p class="tagline">Your coding universe, one place.</p>
            </div>
            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember"><input type="checkbox" id="remember"><span>Remember me</span></label>
                    <a href="#" class="forgot">Forgot?</a>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Sign In</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
                <p class="error-msg" id="errorMsg"></p>
            </form>
            <div class="login-footer"><p>Don't have an account? <a href="#">Request access</a></p></div>
        </div>
        <p class="bottom-note">Secure • Local • Built for coders</p>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
