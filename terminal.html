<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal — RafayLab</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="bg-grid"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-mark small">
                <svg viewBox="0 0 40 40" fill="none"><rect x="2" y="2" width="36" height="36" rx="10" stroke="currentColor" stroke-width="2"/><path d="M10 26L14 12L20 22L26 12L30 26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </div>
            <span class="brand">Rafay<span>Lab</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></a>
            <a href="bots.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Bots</span></a>
            <a href="cheats.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg><span>Cheats</span></a>
            <a href="apk.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span>APK Builder</span></a>
            <a href="web.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg><span>Website</span></a>
            <a href="ai.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="5"/></svg><span>AI Tools</span></a>
            <a href="terminal.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span>Terminal</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">R</div>
                <div class="user-details">
                    <span class="user-name" id="userName">User</span>
                    <span class="user-role" id="userRole">owner</span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
    </aside>

    <main class="main-content">
        <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

        <header class="topbar">
            <div class="topbar-left">
                <h1>Terminal</h1>
                <p>Run commands — RafayLab shell</p>
            </div>
            <div class="topbar-right">
                <span class="status-badge">
                    <span class="status-dot"></span>
                    Shell Ready
                </span>
            </div>
        </header>

        <section class="terminal-container">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="terminal-title">rafay@lab:~</div>
                <button class="terminal-clear" id="clearBtn">Clear</button>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="terminal-line welcome">
                    <span class="term-accent">RafayLab Terminal v1.0</span>
                    <br>Type <span class="term-cmd">help</span> to see available commands.
                    <br>
                </div>
                <div class="terminal-prompt-line" id="promptLine">
                    <span class="term-user">rafay</span><span class="term-symbol">@</span><span class="term-host">lab</span><span class="term-symbol">:</span><span class="term-path">~</span><span class="term-symbol">$</span>
                    <input type="text" class="terminal-input" id="terminalInput" autocomplete="off" autofocus>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/terminal.js"></script>
</body>
</html>
